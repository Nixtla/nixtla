# Tag push `conformalforecast/v*` -> PyPI, manual dispatch -> TestPyPI dry run
# (same build path). The publish step lives here, not in the template: PyPI
# trusted publishing matches the job_workflow_ref claim, which names the file
# this step runs in, so conformalforecast-publish.yml is what gets registered on
# PyPI and TestPyPI.
#
# Gates carried over from the pre-monorepo release.yml: the tag must match
# __version__, CITATION.cff must declare it for a final release, and the full
# CI suite must pass on the tagged commit. CI is called as a reusable workflow
# rather than polled for: with path-filtered triggers the release commit need
# not have a CI run of its own, and polling for one would block until timeout.
name: publish conformalforecast

on:
  push:
    tags: ['conformalforecast/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/conformalforecast
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The version is dynamic (hatch reads __init__.py), so it is read from
      # there rather than from pyproject.toml.
      - name: Check the release tag matches the package version
        shell: python
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          import os
          import pathlib
          import re

          source = pathlib.Path("src/conformalforecast/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not find __version__ in src/conformalforecast/__init__.py")
          version = match.group(1)

          if os.environ["IS_TAG"] != "true":
              print(f"Dispatch run: TestPyPI rehearsal of {version}; no tag to check.")
              raise SystemExit(0)

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"conformalforecast/v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")

          # Citation metadata records final releases only, so a pre-release
          # version must not be forced into CITATION.cff.
          if re.search(r"(a|b|rc|\.dev)\d+$", version):
              print(f"Pre-release {version}: skipping the CITATION.cff version check.")
          else:
              citation = pathlib.Path("CITATION.cff").read_text()
              if f"version: {version}" not in citation:
                  raise SystemExit(
                      f"CITATION.cff does not declare version {version!r}; bump it with the release."
                  )

  ci:
    uses: ./.github/workflows/conformalforecast-ci.yml
    permissions:
      contents: read

  # The template's guard job refuses tags that aren't on main.
  build:
    needs: [validate-version, ci]
    uses: ./.github/workflows/_build-pure.yml
    with:
      package: conformalforecast

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'release' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}
          # the version under test may already be on TestPyPI
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
