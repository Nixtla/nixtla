repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        files: ^(synforecast|tests|examples|docs|benchmarks)/
        args: [--fix]
      - id: ruff-format
        files: ^(synforecast|tests|examples|docs|benchmarks)/
  - repo: local
    hooks:
      - id: rust-licenses
        name: regenerate Rust third-party license notices
        entry: make rust_licenses
        language: system
        files: ^(rust/(Cargo\.(toml|lock)|about\.(hbs|toml))|synforecast/THIRD_PARTY_RUST\.md)$
        pass_filenames: false
