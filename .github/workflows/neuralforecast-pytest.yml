name: pytest (neuralforecast)

on:
  push:
    branches: [main]
    paths:
      - "packages/neuralforecast/**"
      - ".github/workflows/neuralforecast-*.yml"
      - "packages/coreforecast/python/**"
      - "packages/coreforecast/src/**"
      - "packages/coreforecast/include/**"
      - "packages/coreforecast/external_libs/**"
      - "packages/coreforecast/CMakeLists.txt"
      - "packages/coreforecast/pyproject.toml"
      - "packages/utilsforecast/utilsforecast/**"
      - "packages/utilsforecast/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "packages/neuralforecast/**"
      - ".github/workflows/neuralforecast-*.yml"
      - "packages/coreforecast/python/**"
      - "packages/coreforecast/src/**"
      - "packages/coreforecast/include/**"
      - "packages/coreforecast/external_libs/**"
      - "packages/coreforecast/CMakeLists.txt"
      - "packages/coreforecast/pyproject.toml"
      - "packages/utilsforecast/utilsforecast/**"
      - "packages/utilsforecast/pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/neuralforecast

jobs:
  all-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest-xlarge, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "packages/neuralforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --group aws --extra spark

      - name: Run pytest (macos)
        if: runner.os == 'macOS'
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: 1
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: 0.0
        run: uv run pytest --ignore tests/test_common --ignore tests/test_models --ignore tests/test_core.py --no-cov

      - name: Run pytest (ubuntu and windows)
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        run: uv run pytest