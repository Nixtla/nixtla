name: CI (mlforecast)

on:
  push:
    branches: [main]
    paths:
      - "packages/mlforecast/**"
      - ".github/workflows/mlforecast-*.yml"
      - "packages/coreforecast/python/**"
      - "packages/coreforecast/src/**"
      - "packages/coreforecast/include/**"
      - "packages/coreforecast/external_libs/**"
      - "packages/coreforecast/CMakeLists.txt"
      - "packages/coreforecast/pyproject.toml"
      - "packages/utilsforecast/utilsforecast/**"
      - "packages/utilsforecast/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "packages/mlforecast/**"
      - ".github/workflows/mlforecast-*.yml"
      - "packages/coreforecast/python/**"
      - "packages/coreforecast/src/**"
      - "packages/coreforecast/include/**"
      - "packages/coreforecast/external_libs/**"
      - "packages/coreforecast/CMakeLists.txt"
      - "packages/coreforecast/pyproject.toml"
      - "packages/utilsforecast/utilsforecast/**"
      - "packages/utilsforecast/pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/mlforecast

jobs:
  efficiency-tests:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "packages/mlforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # 5.6.1
        with:
          working-directory: packages/mlforecast
          mode: simulation
          token: ${{ secrets.CODESPEED_TOKEN }}
          run: uv run pytest tests/bench_pipeline.py tests/bench_pooled.py --codspeed -n 4 --no-cov -p no:rerunfailures

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "packages/mlforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run m4 performance tests
        run: uv run pytest tests/test_m4.py --no-cov
