version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies"]
    groups:
      ci-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Keep compatible library lower bounds stable while updating uv.lock.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]
    groups:
      pre-commit-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        # Ruff is pre-1.0, so keep minor updates isolated for review.
        update-types: ["patch"]
