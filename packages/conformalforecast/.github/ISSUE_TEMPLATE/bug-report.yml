name: Bug report
description: Report reproducible incorrect behavior in ConformalForecast
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please provide reproducible steps.
        For usage questions and support, use the [Nixtla community Slack](https://join.slack.com/t/nixtlacommunity/shared_invite/zt-1pmhan9j5-F54XR20edHk0UtYAPcW4KQ).
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproducible example
      description: >-
        Provide the smallest script and seed that reproduce the problem. Use
        `numpy.random.default_rng(seed)` so we see the same arrays you do.
      render: python
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: >-
        Include the ConformalForecast, Python, numpy, pandas and scipy versions,
        the forecasting library and version if one is involved, and the OS.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Which layer is affected?
      description: >-
        Each method class carries both the array-level calibration math and the
        forecaster adapter surface.
      options:
        - "Method (conformalforecast.methods)"
        - "Adapter (statsforecast, mlforecast, neuralforecast, callable)"
        - "Diagnostics or panel helpers"
        - "Documentation or packaging"
        - "Unknown"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Severity
      description: How does this issue affect your work?
      options:
        - "Low: An annoyance with an available workaround"
        - "Medium: A significant difficulty"
        - "High: Blocks the affected workflow"
        - "Critical: Silently wrong intervals or coverage"
    validations:
      required: false
