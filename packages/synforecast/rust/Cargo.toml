[package]
name = "synforecast"
version = "0.1.0"
edition = "2021"
description = "Rust acceleration for SynForecast synthetic time-series generation"
license = "Apache-2.0"
repository = "https://github.com/Nixtla/synforecast"
publish = false

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
nalgebra = "0.33"
rand = "0.9"
rand_mt = "5"
rand_distr = "0.5"
num-complex = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
