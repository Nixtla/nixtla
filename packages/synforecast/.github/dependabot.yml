version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "python:uv"]
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        # Rust's 0.x minor releases may contain breaking changes.
        update-types: ["patch"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      pre-commit-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        # Ruff is pre-1.0, so keep minor updates isolated for review.
        update-types: ["patch"]
