name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: New Features
    label: feature
  - title: Breaking Changes
    label: breaking change
  - title: Bug Fixes
    label: fix
  - title: Documentation
    label: documentation
  - title: Dependencies
    label: dependencies
  - title: Enhancements
    label: enhancement
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## Changes
  $CHANGES
