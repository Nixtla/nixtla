name: pytest (coreforecast)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "packages/coreforecast/**"
      - ".github/workflows/coreforecast-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/coreforecast/**"
      - ".github/workflows/coreforecast-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/coreforecast

jobs:
  all-tests:
    name: Run tests for ${{ matrix.python-version }}-${{ matrix.os-platform[1] }}
    runs-on: ${{ matrix.os-platform[0] }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [311, 312, 313, 314, 314t, 315, 315t]
        os-platform:
          [
            [ubuntu-latest, manylinux_x86_64],
            [ubuntu-24.04-arm, manylinux_aarch64],
            [windows-latest, win_amd64],
            [windows-11-arm, win_arm64],
            [macos-15-intel, macosx_x86_64],
            [macos-latest, macosx_arm64],
          ]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build wheels and run tests
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: packages/coreforecast
          extras: "uv"
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-${{ matrix.os-platform[1] }}
          CIBW_BEFORE_TEST: cd {package} && uv sync --group dev --active
          CIBW_TEST_COMMAND: uv run pytest {package}/tests -k "not efficiency"

  # The t jobs above run the suite on one thread. This one runs every test from
  # several threads at once to catch state shared between calls, on arm64 too
  # since its weaker memory ordering exposes races that x86 hides, with both
  # gcc and AppleClang because they can compile the same race differently.
  free_threading:
    name: Run tests in parallel threads on ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.14t", "3.15t"]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest tests -k "not efficiency" --parallel-threads=4 -W error::RuntimeWarning

  warnings:
    name: Build with -Werror on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      # gcc here, AppleClang on macOS; -Werror is off by default so that a new
      # compiler warning fails this job instead of everyone's source install
      - name: Build with warnings as errors
        run: uv build --wheel -Ccmake.define.COREFORECAST_WERROR=ON

  sanitizers:
    name: Run tests under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      # --no-install-project so uv never builds an uninstrumented coreforecast:
      # it caches that wheel and restores it over the sanitizer build below
      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      # not editable: the scikit-build redirecting finder would otherwise import
      # whatever _lib the sync left behind instead of the instrumented one.
      # No linker flags: cmake puts CMAKE_CXX_FLAGS on the link line too, so the
      # module already comes out with libasan and libubsan as DT_NEEDED. The
      # SHARED ones wouldn't apply either, pybind11_add_module builds a MODULE
      - name: Build with the sanitizers
        run: |
          uv pip install . \
            -Ccmake.build-type=Debug \
            -Ccmake.define.CMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS"

      # --no-sync so it can't reinstall the project over the instrumented build.
      # The runtimes still have to be preloaded even though the module links
      # them: python isn't instrumented, so pulling them in with the module
      # leaves ASan initializing too late to be usable ("runtime does not come
      # first in initial library list"). Both of them, since with libasan alone
      # the process dies with no report the first time a kernel throws.
      # detect_leaks=0 because CPython leaks by design; halt_on_error makes a
      # UBSan report fail the job instead of only printing
      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)" \
            uv run --no-sync pytest tests -k "not efficiency"

  cpp_tests:
    name: Run the C++ kernel tests under ${{ matrix.sanitizer }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # gcc + libstdc++ on Ubuntu, AppleClang + libc++ on macOS: the two
      # differ on what they constant-fold, so a narrowing that gcc accepts
      # in a braced initializer is an error under clang.
      # TSan is its own build because it can't be combined with ASan, and this
      # is the only job that runs the scheduler in parallel.h under it: the
      # Python suite covers it under ASan but never TSan. AppleClang supports
      # it on arm64, so both OSes get both.
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: ["address,undefined", "thread"]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      # only for pybind11's cmake config: find_package is unconditional even
      # though the tests link nothing Python-side
      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      # Debug with the assertions on is the point: a kernel indexing past a
      # span fails here, before any wheel is built. -Werror too, since this is
      # the only place the test sources are compiled. _GLIBCXX_ASSERTIONS is
      # libstdc++'s switch and _LIBCPP_HARDENING_MODE libc++'s; each ignores
      # the other's. --no-sync so uv doesn't build and install the wheel just
      # to print a path.
      - name: Configure and build
        run: |
          cmake -S . -B build/cpp \
            -DCOREFORECAST_BUILD_TESTS=ON \
            -DCOREFORECAST_WERROR=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG" \
            -Dpybind11_DIR="$(uv run --no-sync python -m pybind11 --cmakedir)"
          cmake --build build/cpp --target kernel_tests --parallel

      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/cpp --output-on-failure

  # CodSpeed counts instructions, so the benchmarks below say nothing about what
  # threads do. This is the job that notices a kernel that stopped scaling: it
  # fails when a two-thread speedup drops under the floor in the script. Two and
  # not four because the runner's four vCPUs are two cores plus their
  # hyperthreads; the script says more about it.
  thread_scaling:
    name: Check that the kernels still scale with the thread count
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run
        run: uv run python scripts/bench_threads.py --check

  run_benchmarks:
    # disabled until we have a CodSpeed token
    if: false
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/coreforecast/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          working-directory: packages/coreforecast
          mode: simulation
          token: ${{ secrets.CODESPEED_TOKEN }}
          run: uv run pytest tests/test_efficiency.py --codspeed
