version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-dependencies:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "python:uv"]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      pre-commit-dependencies:
        patterns: ["*"]
