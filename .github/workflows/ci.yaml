name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'timegpt-docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'timegpt-docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-import:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nixtla
        run: pip install uv && uv pip install --system .

      - name: Check import
        run: python -c "from nixtla import NixtlaClient"

  run-notebooks-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip requirements
        run: pip install uv && uv pip install --system ".[dev,distributed]"

      - name: Run nbconvert
        env:
          NIXTLA_API_KEY: ${{ secrets.NIXTLA_DEV_API_KEY }}
          NIXTLA_BASE_URL: ${{ secrets.NIXTLA_DEV_BASE_URL }}
          NIXTLA_API_KEY_CUSTOM: ${{ secrets.NIXTLA_API_KEY_CUSTOM }}
          NIXTLA_BASE_URL_CUSTOM: ${{ secrets.NIXTLA_BASE_URL_CUSTOM }}
        run: |
          run_nbconvert_with_retry() {
            local nb="$1"
            local max_attempts=3
            local delay=10
            local attempt=1
            until jupyter nbconvert --to notebook --execute --inplace "$nb"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Failed to execute $nb after $attempt attempts"
                return 1
              fi
              echo "Attempt $attempt failed for $nb, retrying in ${delay}s..."
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }

          # Notebooks the runner cannot execute:
          #   - the Ray example needs a cluster
          #   - the Snowflake anomaly demo runs inside a Snowflake worksheet,
          #     where get_active_session() resolves; there is no equivalent here
          SKIP_NOTEBOOKS="19_computing_at_scale_ray_distributed.ipynb 4_snowflake_anomaly_demo.ipynb"

          find nbs/docs/ -name "*.ipynb" -print0 | while IFS= read -r -d '' nb; do
            case " $SKIP_NOTEBOOKS " in
              *" $(basename "$nb") "*)
                echo "Skipping $nb..."
                continue
                ;;
            esac
            echo "Running $nb..."
            run_nbconvert_with_retry "$nb"
          done
