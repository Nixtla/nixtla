name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Setup devenv
        run: uv sync --all-groups

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # Typing is adopted incrementally: this list only grows. A module added
      # here must stay mypy-clean (see [tool.mypy] in pyproject.toml).
      - name: Run mypy on typed modules
        run: >-
          uv run mypy
          synforecast/_fitting.py
          synforecast/_coverage.py
          synforecast/_features.py
          synforecast/evaluation.py
          synforecast/utils.py
          synforecast/presets.py
          synforecast/overlays.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
