# Production docs deploy, driven by this package's release tag.
# The pre-monorepo workflows used `release: published`, which in one repo would
# fire for every package's release, so the tag glob is the gate now.
name: docs conformalforecast (release)

on:
  push:
    tags: ['conformalforecast/v*']

jobs:
  docs:
    uses: ./.github/workflows/_docs.yml
    with:
      package: conformalforecast
      python-version: '3.11'
      sync-args: --group docs --group integration-docs
      test-command: uv run --no-sync make test_docs
      check-command: uv run --no-sync python scripts/check_docs_nav.py
      environment: production
    secrets: inherit
    permissions:
      contents: write
