# Tag push `synforecast/v*` -> PyPI, manual dispatch -> TestPyPI dry run (same
# build path). The publish step lives here, not in the template: PyPI trusted
# publishing matches the job_workflow_ref claim, which names the file this step
# runs in, so synforecast-publish.yml is what gets registered on PyPI and
# TestPyPI.
#
# Gates carried over from the pre-monorepo python-publish.yml: the Cargo and
# Python versions must agree and match the tag, and CI must pass on the tagged
# commit. CI is called as a reusable workflow rather than looked up by check
# name: with path-filtered triggers the release commit need not have a CI run of
# its own.
name: publish synforecast

on:
  push:
    tags: ['synforecast/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/synforecast
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check release versions match
        shell: python
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          import os
          import pathlib
          import tomllib

          python_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          cargo_version = tomllib.loads(pathlib.Path("rust/Cargo.toml").read_text())["package"]["version"]
          if cargo_version != python_version:
              raise SystemExit(
                  f"Cargo package version {cargo_version!r} does not match "
                  f"Python package version {python_version!r}"
              )

          if os.environ["IS_TAG"] == "true":
              tag = os.environ["GITHUB_REF_NAME"]
              expected = f"synforecast/v{python_version}"
              if tag != expected:
                  raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")

  ci:
    uses: ./.github/workflows/synforecast-ci.yml
    permissions:
      contents: read

  # The template's guard job refuses tags that aren't on main.
  build:
    needs: [validate-version, ci]
    uses: ./.github/workflows/_build-wheels.yml
    with:
      package: synforecast
      python-versions: '[311,312,313,314,315]'
      os-platforms: >-
        [["ubuntu-latest","manylinux_x86_64"],["ubuntu-24.04-arm","manylinux_aarch64"],["windows-latest","win_amd64"],["macos-15-intel","macosx_x86_64"],["macos-latest","macosx_arm64"]]
      sdist-python-version: '3.11'
      cibw-environment-macos: MACOSX_DEPLOYMENT_TARGET=10.12
      cibw-test-skip: ''
      cibw-test-command: >-
        python -I -c "import synforecast; from synforecast import _lib; assert synforecast.__version__"
      rust: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'release' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}
          # the version under test may already be on TestPyPI
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
