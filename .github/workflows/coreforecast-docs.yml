name: docs coreforecast

on:
  push:
    branches: [main]
    paths:
      - "packages/coreforecast/**"
      - ".github/workflows/coreforecast-docs.yml"
      - ".github/workflows/_docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/coreforecast/**"
      - ".github/workflows/coreforecast-docs.yml"
      - ".github/workflows/_docs.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: choice
        default: staging
        options: [staging, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ./.github/workflows/_docs.yml
    with:
      package: coreforecast
      python-version: '3.11'
      sync-args: --group dev
      environment: ${{ github.event.inputs.environment || 'staging' }}
    secrets: inherit
    permissions:
      contents: write
